name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
          - 20
    # Node 20 is kept in the matrix for runtime-compat signal, but the xo/ava
    # devDependency chain (eslint-plugin-unicorn) now requires Node >=22 at
    # lint-time (e.g. it calls Set.prototype.union, added in Node 22). That's
    # a devtool-only limitation, not a schema-guard runtime bug, so don't let
    # it block CI.
    continue-on-error: ${{ matrix.node-version == 20 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
